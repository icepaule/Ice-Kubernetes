apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-iperf3
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
    app.kubernetes.io/part-of: ice-kubernetes
data:
  grafana-dashboard-iperf3.json: "{\n  \"id\": null,\n  \"uid\": \"iperf3-backbone\",\n  \"title\": \"iperf3 Backbone Throughput\",\n  \"tags\": [\n    \"network\",\n    \"iperf3\"\n  ],\n  \"timezone\": \"browser\",\n  \"schemaVersion\": 39,\n  \"version\": 1,\n  \"refresh\": \"5m\",\n  \"time\": {\n    \"from\": \"now-24h\",\n    \"to\": \"now\"\n  },\n  \"templating\": {\n    \"list\": [\n      {\n        \"name\": \"target\",\n        \"type\": \"query\",\n        \"datasource\": {\n          \"type\": \"prometheus\",\n          \"uid\": \"prometheus\"\n        },\n        \"definition\": \"label_values(iperf3_up, target)\",\n        \"query\": {\n          \"query\": \"label_values(iperf3_up, target)\",\n          \"refId\": \"target-variable\"\n        },\n        \"includeAll\": true,\n        \"multi\": false,\n        \"refresh\": 1,\n        \"sort\": 1,\n        \"current\": {},\n        \"options\": [],\n        \"hide\": 0\n      }\n    ]\n  },\n  \"panels\": [\n    {\n      \"id\": 1,\n      \"title\": \"Durchsatz gesendet (Mbps) - $target\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 0\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Mbits\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"iperf3_sent_bytes{target=\\\"${target:raw}\\\"} * 8 / iperf3_sent_seconds{target=\\\"${target:raw}\\\"} / 1000000\",\n          \"legendFormat\": \"sent\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 2,\n      \"title\": \"Durchsatz empfangen (Mbps) - $target\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 0\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"unit\": \"Mbits\"\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"iperf3_received_bytes{target=\\\"${target:raw}\\\"} * 8 / iperf3_received_seconds{target=\\\"${target:raw}\\\"} / 1000000\",\n          \"legendFormat\": \"received\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 3,\n      \"title\": \"TCP Retransmits - $target\",\n      \"type\": \"timeseries\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 0,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {},\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"iperf3_retransmits{target=\\\"${target:raw}\\\"}\",\n          \"legendFormat\": \"retransmits\",\n          \"refId\": \"A\"\n        }\n      ]\n    },\n    {\n      \"id\": 4,\n      \"title\": \"Probe Up - $target\",\n      \"type\": \"stat\",\n      \"gridPos\": {\n        \"h\": 8,\n        \"w\": 12,\n        \"x\": 12,\n        \"y\": 8\n      },\n      \"datasource\": {\n        \"type\": \"prometheus\",\n        \"uid\": \"prometheus\"\n      },\n      \"fieldConfig\": {\n        \"defaults\": {\n          \"mappings\": [\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"0\": {\n                  \"text\": \"DOWN\",\n                  \"color\": \"red\"\n                }\n              }\n            },\n            {\n              \"type\": \"value\",\n              \"options\": {\n                \"1\": {\n                  \"text\": \"UP\",\n                  \"color\": \"green\"\n                }\n              }\n            }\n          ]\n        },\n        \"overrides\": []\n      },\n      \"targets\": [\n        {\n          \"datasource\": {\n            \"type\": \"prometheus\",\n            \"uid\": \"prometheus\"\n          },\n          \"expr\": \"iperf3_up{target=\\\"${target:raw}\\\"}\",\n          \"legendFormat\": \"up\",\n          \"refId\": \"A\"\n        }\n      ]\n    }\n  ]\n}"
