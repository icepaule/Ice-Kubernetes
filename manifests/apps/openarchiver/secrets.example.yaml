# Template only — NOT applied automatically (not listed in kustomization.yaml).
# Copy to secrets.yaml (gitignored / kept out of the repo), fill in real
# values, then: kubectl apply -f secrets.yaml
#
# Real values live only in the cluster (kubectl -n apps get secret
# openarchiver-env), never in this repo.
apiVersion: v1
kind: Secret
metadata:
  name: openarchiver-env
  namespace: apps
type: Opaque
stringData:
  POSTGRES_PASSWORD: "<postgres password>"
  MEILI_MASTER_KEY: "<meilisearch master key>"
  REDIS_PASSWORD: "<valkey/redis password>"
  JWT_SECRET: "<random secret for signing app JWTs>"
  # Plain value, NO surrounding quotes — imported "7d" (4 bytes incl. the
  # quote chars) breaks the jose time parser and fails every login. See
  # README "JWT_EXPIRES_IN quote bug".
  JWT_EXPIRES_IN: 7d
  # Plain cron expression, NO surrounding quotes — see README
  # "SYNC_FREQUENCY quote bug" (same class of bug as JWT_EXPIRES_IN).
  SYNC_FREQUENCY: "*/5 * * * *"
  ALL_INCLUSIVE_ARCHIVE: "true"
  APP_URL: "https://open-archiver.mpauli.de"
  ORIGIN: "https://open-archiver.mpauli.de"
