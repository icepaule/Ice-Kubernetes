apiVersion: apps/v1
kind: Deployment
metadata:
  name: oa-meilisearch
  namespace: apps
  labels:
    app.kubernetes.io/name: oa-meilisearch
    app.kubernetes.io/part-of: openarchiver
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: oa-meilisearch
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oa-meilisearch
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc-ha
      enableServiceLinks: false
      containers:
      - name: meilisearch
        image: getmeili/meilisearch:v1.15
        ports:
        - containerPort: 7700
        env:
        - name: MEILI_MASTER_KEY
          valueFrom:
            secretKeyRef:
              name: openarchiver-env
              key: MEILI_MASTER_KEY
        resources:
          requests:
            cpu: 200m
            memory: 1Gi
          limits:
            memory: 5Gi
        volumeMounts:
        - name: data
          mountPath: /meili_data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: oa-meilidata
---
apiVersion: v1
kind: Service
metadata:
  name: oa-meilisearch
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: oa-meilisearch
  ports:
  - port: 7700
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: oa-meilidata
  namespace: apps
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi

