apiVersion: apps/v1
kind: Deployment
metadata:
  name: proton-bridge
  namespace: apps
  labels:
    app.kubernetes.io/name: proton-bridge
    app.kubernetes.io/part-of: openarchiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: proton-bridge
  template:
    metadata:
      labels:
        app.kubernetes.io/name: proton-bridge
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc-ha
      enableServiceLinks: false
      containers:
      - name: proton-bridge
        image: shenxn/protonmail-bridge:latest
        ports:
        - containerPort: 25
        - containerPort: 143
        env:
        # Auto-update pulls in newer Bridge builds that need libfido2,
        # missing from this base image. See README "Proton-Bridge was
        # structurally broken" — lib copied into the persisted volume,
        # path added here.
        - name: LD_LIBRARY_PATH
          value: /root/.config/protonmail/extra-libs:/usr/lib/x86_64-linux-gnu:/usr/lib
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 768Mi
        volumeMounts:
        # All of Bridge's state (login session, vault, keychain) must
        # survive pod restarts, otherwise every restart requires an
        # interactive re-login (incl. 2FA).
        - name: bridge-data
          mountPath: /root/.config/protonmail
          subPath: config
        - name: bridge-data
          mountPath: /root/.local/share/protonmail
          subPath: share
        - name: bridge-data
          mountPath: /root/.cache/protonmail
          subPath: cache
        - name: bridge-data
          mountPath: /root/.gnupg
          subPath: gnupg
        - name: bridge-data
          mountPath: /root/.password-store
          subPath: password-store
      volumes:
      - name: bridge-data
        persistentVolumeClaim:
          claimName: proton-bridge-data
---
apiVersion: v1
kind: Service
metadata:
  name: proton-bridge
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: proton-bridge
  ports:
  - name: smtp
    port: 1025
    targetPort: 25
  - name: imap
    port: 1143
    targetPort: 143
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: proton-bridge-data
  namespace: apps
  labels:
    app.kubernetes.io/name: proton-bridge
spec:
  accessModes:
  - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
  storageClassName: local-path
