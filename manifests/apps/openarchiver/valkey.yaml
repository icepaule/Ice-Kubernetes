apiVersion: apps/v1
kind: Deployment
metadata:
  name: oa-valkey
  namespace: apps
  labels:
    app.kubernetes.io/name: oa-valkey
    app.kubernetes.io/part-of: openarchiver
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: oa-valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: oa-valkey
    spec:
      nodeSelector:
        kubernetes.io/hostname: nuc-ha
      enableServiceLinks: false
      containers:
      - name: valkey
        image: valkey/valkey:8-alpine
        args: ["valkey-server", "--requirepass", "$(REDIS_PASSWORD)"]
        ports:
        - containerPort: 6379
        env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: openarchiver-env
              key: REDIS_PASSWORD
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            memory: 128Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: oa-valkey
  namespace: apps
spec:
  selector:
    app.kubernetes.io/name: oa-valkey
  ports:
  - port: 6379

