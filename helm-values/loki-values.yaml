deploymentMode: Monolithic

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  limits_config:
    retention_period: 336h # 14 Tage

singleBinary:
  replicas: 1
  # gepinnt auf nuc-ha: lokales lokal-path-Volume soll nicht zwischen den
  # beiden K3s-Nodes hin- und herwandern muessen, und ki02 soll seine
  # GPU/CPU-Kapazitaet nicht mit Log-Compaction teilen.
  nodeSelector:
    kubernetes.io/hostname: nuc-ha
  persistence:
    enabled: true
    size: 20Gi
    storageClass: local-path

# einzelner Node reicht fuer einen Homelab - keine Memcached-Sidecars noetig
chunksCache:
  enabled: false
resultsCache:
  enabled: false

gateway:
  enabled: false

test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: false
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false

# Monolithic-Mode braucht diese Microservice-Komponenten nicht
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
