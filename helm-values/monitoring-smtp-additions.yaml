# SMTP additions for kube-prometheus-stack grafana subchart.
# Merged onto the live release via --reuse-values so OIDC/adminPassword stay intact.
# Mail path: Grafana -> Axigen (mail.mpauli.de / 10.1.1.11) SMTPS 465 -> direct MX.
#
# Apply (replace placeholder with the real Axigen password, never commit it):
#   sed 's/__SMTP_PASSWORD__/<PW>/' monitoring-smtp-additions.yaml > /tmp/smtp.yaml
#   helm upgrade monitoring prometheus-community/kube-prometheus-stack \
#     --version 82.16.0 -n monitoring --reuse-values -f /tmp/smtp.yaml && rm /tmp/smtp.yaml
#
# Verify send: POST http://<grafana-lb>/api/alertmanager/grafana/config/api/v1/receivers/test
#   body {"receivers":[{"name":"t","grafana_managed_receiver_configs":[{"name":"t",
#   "type":"email","settings":{"addresses":"you@example.com"}}]}]}  -> expect "status":"ok"
grafana:
  # Pod cannot use split-horizon DNS reliably -> pin internal Axigen IP.
  hostAliases:
    - ip: "10.1.1.11"
      hostnames:
        - "mail.mpauli.de"
  # Secret via env-var expansion (chart's assertNoLeakedSecrets forbids plaintext
  # password in grafana.ini) — same pattern as the existing OIDC client_secret.
  env:
    GF_SMTP_PASSWORD: __SMTP_PASSWORD__
  grafana.ini:
    smtp:
      enabled: true
      host: mail.mpauli.de:465
      user: info@mpauli.de
      password: $__env{GF_SMTP_PASSWORD}
      from_address: info@mpauli.de
      from_name: Grafana
      skip_verify: false
